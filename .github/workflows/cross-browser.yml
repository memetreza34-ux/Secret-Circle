name: Secret Circle Cross-Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser smoke matrix
        run: npm run test:cross-browser

      - name: Upload cross-browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-report-${{ github.run_attempt }}
          path: |
            playwright-cross-browser-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
