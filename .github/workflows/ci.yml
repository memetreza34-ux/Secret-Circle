name: Secret Circle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check game-engine.js
          node --check word-packs.js
          node --check accessibility.js
          node --check sw.js
      - name: Compile archive inventory tooling
        run: |
          python -m py_compile \
            tools/inventory_legacy_archive.py \
            tests/archive-inventory.test.py \
            scripts/validate_archive_tool.py \
            scripts/validate_project.py
      - name: Run deterministic engine tests
        run: node tests/engine.test.js
      - name: Validate curated word packs
        run: node tests/content.test.js
      - name: Validate accessibility and offline shell
        run: node tests/accessibility.test.js
      - name: Validate safe legacy archive inventory tooling
        run: python tests/archive-inventory.test.py
      - name: Validate legacy source and deletion boundary
        run: python scripts/validate_archive_tool.py
      - name: Validate offline PWA structure
        run: python scripts/validate_project.py
