name: Secret Circle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check game-engine.js
          node --check word-packs.js
          node --check accessibility.js
          node --check sw.js

      - name: Python-Werkzeuge kompilieren
        run: |
          python -m py_compile \
            tools/inventory_legacy_archive.py \
            tests/archive-inventory.test.py \
            scripts/validate_archive_tool.py \
            scripts/validate_project.py

      - name: Spielengine testen (Fairness, Punkte, Persistenz)
        run: node tests/engine.test.js

      - name: Wortpakete prüfen
        run: node tests/content.test.js

      - name: Markup- und Skriptverträge prüfen
        run: node tests/dom-contract.test.js

      - name: Archivwerkzeug prüfen
        run: |
          python tests/archive-inventory.test.py
          python scripts/validate_archive_tool.py

      - name: Icons reproduzierbar erzeugen
        run: |
          node scripts/build-icons.mjs
          git diff --exit-code -- '*.png'

      - name: Release-Struktur prüfen
        run: python scripts/validate_project.py
