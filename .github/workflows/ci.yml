name: Secret Circle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-circle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies without modifying repository files
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run engine and storage tests
        run: npm test

      - name: Validate offline PWA and release gates
        run: npm run validate

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
