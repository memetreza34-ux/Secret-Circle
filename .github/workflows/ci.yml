name: Secret Circle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-circle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check game-engine.js
          node --check sw.js
      - name: Run deterministic engine tests
        run: node tests/engine.test.js
      - name: Validate offline PWA structure
        run: python scripts/validate_project.py
      - name: Run production release audit
        run: python scripts/release_audit.py
