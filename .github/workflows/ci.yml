name: Secret Circle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-circle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate legacy archive safety tooling
        run: |
          python -m py_compile \
            tools/inventory_legacy_archive.py \
            tests/archive-inventory.test.py \
            scripts/validate_archive_tool.py
          python tests/archive-inventory.test.py
          python scripts/validate_archive_tool.py

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run engine and storage tests
        run: npm test

      - name: Validate offline PWA and release gates
        run: npm run validate

      # WebKit läuft parallel im Job e2e-webkit. Beide Engines in einem Job
      # sprengten mit rund 40 Minuten das Zeitlimit.
      - name: Run browser end-to-end tests (Chromium)
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run browser end-to-end tests (Safari/iOS engine)
        run: npm run test:e2e -- --project=webkit-desktop --project=webkit-mobile

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
