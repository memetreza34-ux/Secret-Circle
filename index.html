<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Circle</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><p class="eyebrow">Lokales Partyspiel</p><h1>Secret Circle</h1><p>Begriffe verteilen, Karten geheim aufdecken und den Imposter finden.</p></header><section id="setup" class="card"><h2>Spiel einrichten</h2><label>Spielernamen<textarea id="players" rows="7" placeholder="Ein Name pro Zeile">Alex
Sam
Mika
Lina</textarea></label><div class="grid"><label>Kategorie<select id="category"><option value="all">Gemischt</option><option value="alltag">Alltag</option><option value="schule">Schule</option><option value="technik">Technik</option><option value="essen">Essen</option></select></label><label>Imposter<input id="imposters" type="number" min="1" max="3" value="1"></label></div><label class="check"><input id="hint" type="checkbox" checked><span>Imposter erhält ein neutrales Hilfswort</span></label><button id="start">Spiel starten</button><p id="setup-error" class="error"></p></section><section id="reveal" class="card" hidden><p id="progress" class="eyebrow"></p><h2 id="player-name"></h2><button id="show-card" class="card-button">Geheime Karte anzeigen</button><div id="secret" class="secret" hidden><p id="role"></p><strong id="word"></strong><small id="hint-text"></small></div><button id="next-player" hidden>Karte schließen und weitergeben</button></section><section id="round" class="card" hidden><h2>Diskussionsrunde</h2><p>Jede Person beschreibt den Begriff, ohne ihn direkt zu nennen.</p><div class="timer"><span id="time">03:00</span><button id="timer-toggle" class="secondary">Timer starten</button></div><div class="actions"><button id="reveal-result">Rollen auflösen</button><button id="new-game" class="secondary">Neues Spiel</button></div><div id="results" hidden></div></section></main><script src="app.js"></script></body></html>
